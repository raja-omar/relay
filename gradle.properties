# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
# IntelliJ IDEA is not yet fully compatible with Loom + configuration cache, see:
# https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Mod identity. Renaming the mod means changing these values, the `dev.relay`
# package name, and ModInfo.ID -- nothing else.
mod_id=relay
mod_name=Relay
mod_version=0.2.0
mod_author=vaify
mod_license=LGPL-3.0-or-later
mod_description=Share Litematica placements with your group. Click Share on a placement and everyone else gets it loaded in the same spot, same rotation. Groups and a few placement helpers live under /relay.
maven_group=dev.relay

# Minecraft / Fabric. Check these against https://fabricmc.net/develop
minecraft_version=1.21.11
loader_version=0.19.5
fabric_api_version=0.141.6+1.21.11
loom_version=1.17.21

# Minecraft 1.21.11 ships with java-runtime-delta, i.e. Java 21.
java_version=21

# Litematica and its own required library, pulled from the Modrinth maven.
# Litematica 0.26.16 declares: malilib >=0.27.19- <0.28.0-
litematica_version=0.26.16
malilib_version=0.27.20

# Lunar Adventure (Kyori Adventure) — text/click/hover components for chat, HUD, and the overlay.
# adventure-platform-fabric 6.8.0 is the 1.21.11 adapter and ships Adventure 4.25.0.
# The extra versions are jars the platform itself nests; a nested platform jar will not unpack
# *its* own nested jars, so Relay includes them the same way it includes owo's extras.
adventure_version=4.25.0
adventure_platform_version=6.8.0
adventure_platform_api_version=4.4.1
adventure_examination_version=1.3.0
adventure_option_version=1.1.0

# owo-ui, the overlay's widget/layout library. Nested in the Relay jar.
# These extra versions are the jars owo-lib itself nests; a nested owo jar will not unpack
# *its* own nested jars, so Relay includes them the same way it includes conditional-mixin.
owo_version=0.13.0+1.21.11
endec_version=0.1.12
endec_netty_version=0.1.6
endec_gson_version=0.1.7
endec_jankson_version=0.1.7
jankson_version=1.2.2
kdl4j_version=1.0.1
# Litematica and MaLiLib bundle this as a nested jar. Loom does not unpack nested jars into the
# dev run, so we add it there by hand; keep it equal to the version inside the Litematica jar.
conditional_mixin_version=0.6.4

# Test dependencies (server/common modules only -- nothing Minecraft related)
junit_version=5.14.4
