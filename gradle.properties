# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
# IntelliJ IDEA is not yet fully compatible with Loom + configuration cache, see:
# https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Mod identity. Renaming the mod means changing these three values, the fabric.mod.json
# description, the `dev.relay` package name, and ModInfo.ID -- nothing else.
mod_id=relay
mod_name=Relay
mod_version=0.1.0
maven_group=dev.relay

# Minecraft / Fabric. Check these against https://fabricmc.net/develop
minecraft_version=1.21.11
loader_version=0.19.5
fabric_api_version=0.141.6+1.21.11
loom_version=1.17.21

# Minecraft 1.21.11 ships with java-runtime-delta, i.e. Java 21.
java_version=21

# Litematica and its own required library, pulled from the Modrinth maven.
# Litematica 0.26.16 declares: malilib >=0.27.19- <0.28.0-
litematica_version=0.26.16
malilib_version=0.27.20
# Litematica and MaLiLib bundle this as a nested jar. Loom does not unpack nested jars into the
# dev run, so we add it there by hand; keep it equal to the version inside the Litematica jar.
conditional_mixin_version=0.6.4

# Test dependencies (server/common modules only -- nothing Minecraft related)
junit_version=5.14.4
